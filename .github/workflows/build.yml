name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Force system Python to 3.11
        run: |
          sudo apt update
          sudo apt install -y software-properties-common
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt update
          sudo apt install -y python3.11 python3.11-venv python3.11-dev
          curl -sS https://bootstrap.pypa.io/get-pip.py | sudo python3.11
          mkdir -p /home/runner/pybin
          ln -sf /usr/bin/python3.11 /home/runner/pybin/python
          ln -sf /usr/bin/python3.11 /home/runner/pybin/python3
          echo "/home/runner/pybin" >> $GITHUB_PATH
          /home/runner/pybin/python --version
          /home/runner/pybin/python3 --version

      - name: Install system dependencies
        run: |
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
         python3 -m pip install --upgrade pip --break-system-packages
          python3 -m pip install --user buildozer cython --break-system-packages
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Bootstrap build (downloads SDK/NDK, license error expected here)
        continue-on-error: true
        run: |
          buildozer -v android debug

      - name: Accept Android SDK licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

      - name: Clean stale recipe build state (keep downloaded SDK/NDK)
        run: |
          rm -rf ~/.buildozer/android/platform/build-*

      - name: Build APK (real build)
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
